version: '3.8'

services:
  nexus:
    build: .
    container_name: nexus-memory-system
    restart: unless-stopped
    ports:
      - "8767:8767"  # MCP API
      - "8768:8768"  # Web UI
    environment:
      - NEXUS_HOST=0.0.0.0
      - NEXUS_PORT=8767
      - NEXUS_WEB_PORT=8768
      - NEXUS_DATABASE_URL=sqlite:///data/nexus.db
      - NEXUS_VERBOSE=true
      - NEXUS_CORS_ORIGINS=["http://localhost:8768", "http://127.0.0.1:8768"]
    volumes:
      - nexus_data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8767/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nexus-postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nexus
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - nexus_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nexus-web:
    build: .
    container_name: nexus-web-only
    restart: unless-stopped
    ports:
      - "8769:8768"
    environment:
      - NEXUS_HOST=0.0.0.0
      - NEXUS_WEB_PORT=8768
      - NEXUS_DATABASE_URL=postgresql://nexus:nexus_password@nexus-postgres:5432/nexus
      - NEXUS_REDIS_URL=redis://:redis_password@nexus-redis:6379/0
    volumes:
      - nexus_web_data:/app/data
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
    command: ["nexus-ui"]
    profiles:
      - web-only

volumes:
  nexus_data:
    driver: local
  nexus_postgres_data:
    driver: local
  nexus_redis_data:
    driver: local
  nexus_web_data:
    driver: local

networks:
  default:
    name: nexus-network