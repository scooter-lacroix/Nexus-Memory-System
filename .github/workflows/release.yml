name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: crates-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish crates & create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Install Python 3 (for metadata parsing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract workspace version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected workspace version: ${VERSION}"

      - name: Check if release already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate workspace
        if: steps.check.outputs.skip == 'false'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish crates to crates.io
        if: steps.check.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Nexus Memory System ${TAG}" \
            --generate-notes

      - name: Summary
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🚀 Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Published crates" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crate | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          cargo metadata --format-version 1 --no-deps \
            | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          ws = set(meta.get('workspace_members', []))
          for p in sorted((p['name'] for p in meta['packages'] if p['id'] in ws)):
              print(f'| [\`{p}\`](https://crates.io/crates/{p}) | ${VERSION} |')
          " >> "$GITHUB_STEP_SUMMARY"
